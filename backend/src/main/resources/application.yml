spring:
  application:
    name: polla
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polla}
    username: ${DB_USERNAME:polla}
    password: ${DB_PASSWORD:polla}
    hikari:
      # Fallar rápido (ADR-0007): esperar una conexión del pool como máximo 5 s.
      connection-timeout: 5000
      data-source-properties:
        # Límites para TODA sentencia de la app: nada puede quedar bloqueado indefinidamente.
        options: "-c lock_timeout=5000 -c statement_timeout=15000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
      completion-mode: update

server:
  # IP real del cliente detrás de los proxies (Azure Envoy → nginx → API). "native" usa el RemoteIpValve de Tomcat:
  # lee X-Forwarded-For de DERECHA a IZQUIERDA saltando proxies de confianza (IPs privadas), así que lo que el cliente
  # escriba a la izquierda se ignora. "framework" tomaría el PRIMER valor, que el cliente controla (rate limit evadible).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    # Swagger UI muestra el contrato escrito a mano (fuente de verdad, ADR-0005)
    url: /openapi.yaml
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Secreto HS256 codificado en Base64 (mínimo 32 bytes). Obligatorio fuera del perfil local.
      secret: ${JWT_SECRET:}
      ephemeral-secret-allowed: false
      issuer: polla-mundialista
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      cookie-name: refresh_token
      cookie-path: /api/v1/auth
      cookie-secure: ${COOKIE_SECURE:true}
    login-rate-limit:
      max-attempts: 10
      window: 1m
    cors:
      # Vacío = mismo origen (front servido detrás de un proxy /api). Separar por comas si se necesita.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Administrador}
  demo:
    # Participantes demo con predicciones (nunca resultados). Útil para la presentación.
    enabled: ${DEMO_DATA:false}
    password: ${DEMO_PASSWORD:}
  # Purga por lotes (ADR-0007): cada lote es una transacción corta con sus propios timeouts.
  purge:
    batch-size: 5000
    lock-timeout: 2s
    statement-timeout: 10s
  account-deletion:
    # Cada cuánto se intenta borrar la fila de cuentas eliminadas cuyos datos ya se purgaron.
    finalize-interval: PT1M
  events:
    # Reenvío de eventos cuyo listener falló (p. ej. timeout de un lote).
    retry-interval: PT5M
    retry-older-than: PT5M
  scoring:
    exact-points: 3
    outcome-points: 1

logging:
  level:
    org.springframework.modulith.events: info

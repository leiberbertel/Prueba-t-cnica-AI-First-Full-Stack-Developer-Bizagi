name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · tests (unit + integración + módulos + contrato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend · contrato + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: El cliente generado coincide con specs/api/openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api || (echo "::error::El cliente API está desactualizado. Ejecuta npm run generate:api" && exit 1)
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · build de imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t polla-api .
      - run: docker build -t polla-web frontend

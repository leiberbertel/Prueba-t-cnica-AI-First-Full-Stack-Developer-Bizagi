# Levanta todo el stack: docker compose up --build  →  http://localhost:4000
name: polla-mundialista

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polla
      POSTGRES_USER: ${DB_USERNAME:-polla}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (./scripts/init-env.sh)}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-polla} -d polla"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/polla
      DB_USERNAME: ${DB_USERNAME:-polla}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (./scripts/init-env.sh)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env (./scripts/init-env.sh)}
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Define DEMO_PASSWORD en .env (./scripts/init-env.sh)}
      # http://localhost no usa TLS; en producción (HTTPS) debe ser true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "4000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
